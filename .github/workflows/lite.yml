name: lite
on:
  push:
    branches: [main]
    paths: ['packages/lite/**', '.github/workflows/lite.yml']
  pull_request:
    paths: ['packages/lite/**', '.github/workflows/lite.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core-and-install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    defaults:
      run:
        working-directory: packages/lite
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: npm test
      - run: npm run test:package
  adapter-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: node --test packages/lite/tests/adapters.test.mjs packages/lite/tests/mcp.test.mjs
