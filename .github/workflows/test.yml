name: test-and-install
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 22
          - os: ubuntu-latest
            node: 24
          - os: ubuntu-latest
            node: 26
          - os: macos-latest
            node: 24
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - run: npm run test:package
      - name: Install pinned native dependency
        run: node bin/agent-dialogue.mjs setup
      - name: Check installed tool
        run: node bin/agent-dialogue.mjs doctor --json
  windows-native:
    runs-on: windows-latest
    # Lifecycle v2 exercises private dispatch/control locks with real SID/ACL
    # checks and owned child workers. Keep per-operation deadlines unchanged.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Native Windows contracts, ledger and lifecycle
        shell: pwsh
        run: >-
          node --test --test-concurrency=1
          tests/atomic-rename.test.mjs
          tests/bridge-store.test.mjs
          tests/embedded-ledger.test.mjs
          tests/inspect.test.mjs
          tests/inspect-cli.test.mjs
          tests/lifecycle.test.mjs
          tests/lifecycle-delivery.test.mjs
          tests/lifecycle-observation.test.mjs
          tests/lifecycle-runtime.test.mjs
          tests/lifecycle-bridge.test.mjs
          tests/lifecycle-cli.test.mjs
          tests/windows-platform.test.mjs
          tests/windows-node-card.test.mjs
          tests/windows-transport.test.mjs
          tests/windows-viewer.test.mjs
          tests/windows-worker.test.mjs
          tests/opencode-v1.test.mjs
          tests/windows-integration-contract.test.mjs
          tests/native-admission.test.mjs
          tests/kimi.test.mjs
          tests/zcode.test.mjs
          tests/zcode-wiring.test.mjs
          tests/mcp-stdio.test.mjs
          tests/mcp-tools.test.mjs
          tests/zcode-mcp-ingress.test.mjs
          tests/zcode-plugin.test.mjs
          tests/zcode-cli.test.mjs
          tests/tool-inbox-viewer.test.mjs
          tests/kimi-wiring.test.mjs
          tests/kimi-integration-contract.test.mjs
          tests/node-transport.test.mjs
          tests/node-identity.test.mjs
          tests/private-files.test.mjs
      - name: Initialize and check an isolated embedded ledger
        shell: pwsh
        env:
          AGENT_DIALOGUE_LEDGER: embedded
        run: |
          $env:AGENT_DIALOGUE_STATE_DIR = Join-Path $env:RUNNER_TEMP 'agent-dialogue-ci-state'
          $env:AGENT_DIALOGUE_CACHE_DIR = Join-Path $env:RUNNER_TEMP 'agent-dialogue-ci-cache'
          node bin/agent-dialogue.mjs setup
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node bin/agent-dialogue.mjs doctor --json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  windows-recovery-state:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Native Windows recovery state and fixed submissions
        shell: pwsh
        run: >-
          node --test --test-concurrency=1
          tests/recovery-schema.test.mjs
          tests/recovery-evidence.test.mjs
          tests/recovery-submissions.test.mjs
          tests/recovery-mcp.test.mjs
          tests/recovery-cli.test.mjs
  windows-recovery-forwarding:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Native Windows exact forwarding and stopped runtime recovery
        shell: pwsh
        run: >-
          node --test --test-concurrency=1
          tests/recovery-nodes.test.mjs
          tests/recovery-forwarding.test.mjs
          tests/recovery-runtime.test.mjs
  windows-native-recovery:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Exact persisted native input and stopped owner recovery
        shell: pwsh
        run: >-
          node --test --test-concurrency=1
          tests/native-proof.test.mjs
          tests/native-recovery.test.mjs
          tests/native-recovery-adversarial.test.mjs
          tests/native-recovery-cli.test.mjs
          tests/native-worker-review.test.mjs
  windows-lock-recovery:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Private v4 schema and explicit offline lock quarantine
        shell: pwsh
        run: >-
          node --test --test-concurrency=1
          tests/native-recovery-schema.test.mjs
          tests/lock-recovery.test.mjs
          tests/lock-recovery-cli.test.mjs
